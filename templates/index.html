<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>웹 챗봇</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <main class="app">
    <header class="header">
      <button id="new-chat" type="button" class="new-chat">새 대화</button>
      <div class="header-title">
        <h1>웹 챗봇</h1>
        <p>gpt-4o-mini</p>
      </div>
      <button id="clear" type="button" class="icon-btn" aria-label="대화 기록 지우기" title="대화 기록 지우기">
        <svg viewBox="0 0 24 24" width="20" height="20">
          <path d="M8 7h8M9.5 7V5.8A1.8 1.8 0 0 1 11.3 4h1.4a1.8 1.8 0 0 1 1.8 1.8V7m-7 0h9l-.7 12.2a1.5 1.5 0 0 1-1.5 1.4h-4.6a1.5 1.5 0 0 1-1.5-1.4L6.8 7Z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
    </header>

    <div id="saved" class="saved" hidden></div>

    <section id="chat" class="chat" aria-live="polite" aria-label="채팅창"></section>

    <form id="form" class="composer">
      <span class="plus" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="24" height="24">
          <path d="M12 5v14M5 12h14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
        </svg>
      </span>
      <input
        id="input"
        type="text"
        placeholder="메시지를 입력하세요"
        autocomplete="off"
        aria-label="메시지 입력"
        required
      >
      <button id="send" type="submit" aria-label="보내기">
        <svg viewBox="0 0 24 24" width="18" height="18">
          <path d="M5 12h12M13 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
    </form>
  </main>

  <script src="{{ url_for('static', filename='chat.js') }}"></script>
</body>
</html>
